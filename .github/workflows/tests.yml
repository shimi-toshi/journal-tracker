name: Tests

on:
  push:
    # 日次更新ジョブのコミット（DB・公開ページのみ）では走らせない
    paths-ignore:
      - 'data/**'
      - 'docs/**'
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Self check
        run: python -m src.main --self-check
